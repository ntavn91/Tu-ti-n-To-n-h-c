<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#19375e"/>
      <stop offset="100%" stop-color="#081424"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd875"/>
      <stop offset="100%" stop-color="#e69c24"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7bf5ea"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#cyan)" stroke-width="3" opacity="0.6"/>

  <!-- Yin Yang Cultivation Core -->
  <g transform="translate(256, 256) scale(1.35)">
    <!-- Base circle -->
    <circle cx="0" cy="0" r="100" fill="#f8fafc"/>
    <!-- Dark half -->
    <path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100" fill="#0f2137"/>
    <!-- Small dots -->
    <circle cx="0" cy="-50" r="16" fill="#0f2137"/>
    <circle cx="0" cy="50" r="16" fill="#f8fafc"/>
  </g>

  <!-- Bagua Trigrams (Decorations) -->
  <g stroke="url(#gold)" stroke-width="6" stroke-linecap="round">
    <!-- Top -->
    <line x1="216" y1="52" x2="296" y2="52"/>
    <line x1="216" y1="64" x2="296" y2="64"/>
    <line x1="216" y1="76" x2="296" y2="76"/>
    <!-- Bottom -->
    <line x1="216" y1="436" x2="248" y2="436"/> <line x1="264" y1="436" x2="296" y2="436"/>
    <line x1="216" y1="448" x2="248" y2="448"/> <line x1="264" y1="448" x2="296" y2="448"/>
    <line x1="216" y1="460" x2="248" y2="460"/> <line x1="264" y1="460" x2="296" y2="460"/>
  </g>
</svg>
